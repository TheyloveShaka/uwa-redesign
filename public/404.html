<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Uganda Wildlife Authority | Ten national parks</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct load or refresh of
      a client-side route (e.g. /parks/bwindi) hits Pages' own 404 handler
      instead of the app. This is the standard workaround: encode the real
      path into a query string and redirect to the app's root, where the
      matching script in index.html decodes it and hands it back to the
      router before React ever renders. https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keeps "/uwa-redesign" — the project page prefix
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
